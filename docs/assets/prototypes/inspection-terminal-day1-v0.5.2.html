// Glyph atlas is rasterized at the *native* 640px raster. Alpha is thresholded

const glyphCache=new Map();
function glyph(ch,size=12,kind='song',color=C.ink){
 const key=[ch,size,kind,color].join('/');if(glyphCache.has(key))return glyphCache.get(key);
 const wide=/[^\u0000-\u00ff]/.test(ch),cell=wide?size:Math.ceil(size*.61); const pad=3;
 const a=document.createElement('canvas');a.width=cell+pad*2;a.height=size+pad*2;
 const t=a.getContext('2d',{willReadFrequently:true});t.clearRect(0,0,a.width,a.height);
 const family=kind==='mono'?"'Lucida Console','Courier New',monospace":kind==='hei'?"'Noto Sans Mono CJK SC','Microsoft YaHei',sans-serif":"'SimSun','AR PL SungtiL GB','Noto Serif CJK SC',serif";
 t.font=`${size}px ${family}`;t.textBaseline='alphabetic';t.fillStyle='#fff';t.fillText(ch,pad,size+1);
 const pixels=t.getImageData(0,0,a.width,a.height);
 const rgb=color.replace('#','');const R=parseInt(rgb.slice(0,2),16),G=parseInt(rgb.slice(2,4),16),B=parseInt(rgb.slice(4,6),16);
 for(let i=0;i<pixels.data.length;i+=4){const coverage=pixels.data[i+3];const alpha=coverage>175?245:coverage>85?170:coverage>25?85:0;pixels.data[i]=R;pixels.data[i+1]=G;pixels.data[i+2]=B;pixels.data[i+3]=alpha;}
 t.putImageData(pixels,0,0); glyphCache.set(key,{canvas:a,cell});return glyphCache.get(key);
}
function text(s,x,y,color=C.ink,size=12,kind='song',max=999){s=String(s??'');let px=Math.round(x);for(const ch of s){const a=glyph(ch,size,kind,color);if(px+a.cell>x+max)break;g.drawImage(a.canvas,px-3,Math.round(y)-3);px+=a.cell+ (kind==='mono'?0:0);}return px;}
function wrapped(s,x,y,maxw,maxh,color=C.ink,size=12,kind='song',leading=15){s=String(s??'');let line='',py=y;const flush=()=>{if(line&&py+size<=y+maxh){text(line,x,py,color,size,kind,maxw);py+=leading;}line='';};for(const ch of s){if(ch==='\n'){flush();continue;}const chars=(line+ch).split('');const width=chars.reduce((n,c)=>n+glyph(c,size,kind,color).cell,0);if(width>maxw&&line)flush();line+=ch;}flush();return py;}

 }

function initializeGL(){
 try{gl=screen.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('no GL');
 const vs=`attribute vec2 a; varying vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
 const fs=`precision mediump float;varying vec2 uv;uniform sampler2D uTex;uniform float mode;void main(){vec2 p=uv;vec3 rgb=texture2D(uTex,p).rgb;float s=sin(p.y*360.0*3.14159);float lineVal=step(0.1,s);float scan=mode<.5?1.0:(mode<1.5?mix(.965,1.0,lineVal):mix(.91,1.0,lineVal));float vig=1.-(mode<.5?0.0:(mode<1.5?0.065:0.14))*pow(length((p-.5)*vec2(1.2,1.0)),1.75);gl_FragColor=vec4(rgb*scan*vig,1.0);}`;
 function compile(type,source){let sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}
 program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 const p=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,p);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 gl.useProgram(program);const a=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(gl.getUniformLocation(program,'uTex'),0);shader=gl.getUniformLocation(program,'mode');
 }catch(err){console.warn('WebGL fallback',err);gl=null;ui=screen.getContext('2d',{alpha:false});ui.imageSmoothingEnabled=false;}
}
function paintGL(){gl.viewport(0,0,W,H);gl.useProgram(program);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,raw);gl.uniform1f(shader,displayMode);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function displayNode(id){
 if(id==='END_DAY1'){finish();return;}
 if(id==='D1_MEASURE'){S.node='D1_MEASURE';S.mode='measure';S.light=S.trust>=S.threshold?'green':'red';requestDraw();return;}
 if(DATA.choices[id]){S.node=id;S.mode='choice';S.selectedOption=-1;requestDraw();return;}
 const n=DATA.nodes[id];if(!n){console.error('缺失节点',id);return;}
 S.node=id;S.mode='line';S.line=n.text;S.lastSpeech=n.text;S.round=n.round;S.portrait=n.portrait||S.portrait;S.log.push({speaker:'对象',txt:n.text});requestDraw();
}
function step(){if(S.history||S.mode!=='line')return;const n=DATA.nodes[S.node];if(n)displayNode(n.next);}
function pick(i){if(S.history||S.mode!=='choice')return;const o=DATA.choices[S.node]?.[i];if(!o)return;S.trust+=Number(o.delta)||0;S.log.push({speaker:'值班员',txt:o.text});displayNode(o.next);}
function disposition(type){if(S.mode!=='measure'||(type==='释放'&&S.light!=='green'))return;S.pending=type;obj.done=true;obj.status=type;if(type==='净化')S.quota--;S.light='off';S.log.push({speaker:'值班员',txt:'【处置】'+type});displayNode(DATA.measures[type].next);}
function finish(){S.node='END_DAY1';S.mode='finishing';S.signal='glitch';requestDraw();if(flashTimer)clearTimeout(flashTimer);flashTimer=setTimeout(()=>{S.signal='lost';S.mode='complete';flashTimer=null;requestDraw();},680);}
function reset(){if(flashTimer)clearTimeout(flashTimer);obj.done=false;obj.status='待审';Object.assign(S,{page:'roster',node:'',mode:'line',line:'',portrait:'ML01',round:'R1',log:[],history:false,historyOffset:0,selectedOption:-1,rosterIndex:0,hover:null,light:'off',trust:0,quota:5,pending:'',signal:'live',lastSpeech:'',started:false});requestDraw();}
function fit(){let zone=$('screen-area');let scale=Math.max(1,Math.min(4,Math.floor(Math.min((zone.clientWidth-24)/W,(zone.clientHeight-12)/H))));if(zone.clientWidth<W+24||zone.clientHeight<H+12)scale=Math.min((zone.clientWidth-24)/W,(zone.clientHeight-12)/H);screen.style.width=Math.floor(W*scale)+'px';screen.style.height=Math.floor(H*scale)+'px';}
function setPointer(e){const box=screen.getBoundingClientRect();pointer={x:Math.floor((e.clientX-box.left)*W/box.width),y:Math.floor((e.clientY-box.top)*H/box.height)};const hit=regions.slice().reverse().find(r=>pointer.x>=r.x&&pointer.x<r.x+r.w&&pointer.y>=r.y&&pointer.y<r.y+r.h);const nxt=hit?.id??null;screen.style.cursor=hit?'pointer':'default';if(nxt!==S.hover){S.hover=nxt;requestDraw();}return hit;}
screen.addEventListener('mousemove',setPointer);screen.addEventListener('mouseleave',()=>{S.hover=null;pointer={x:-1,y:-1};requestDraw();});
screen.addEventListener('click',e=>{screen.focus({preventScroll:true});const hit=setPointer(e);if(hit)hit.action();});
screen.addEventListener('dblclick',e=>{const hit=setPointer(e);if(hit?.dbl)hit.dbl();});
screen.addEventListener('wheel',e=>{if(S.page==='review'&&S.history&&S.log.length>5){S.historyOffset=Math.max(0,Math.min(S.log.length-5,S.historyOffset+(e.deltaY<0?1:-1)));requestDraw();e.preventDefault();}},{passive:false});
document.addEventListener('keydown',e=>{
 if(['SELECT','INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;
 if(S.page==='roster'){if(e.key==='ArrowUp'){S.rosterIndex=Math.max(0,S.rosterIndex-1);requestDraw();e.preventDefault();}else if(e.key==='ArrowDown'){S.rosterIndex=Math.min(4,S.rosterIndex+1);requestDraw();e.preventDefault();}else if(e.key==='Enter'){enterSelected();e.preventDefault();}return;}
 if(e.key==='Escape'){if(S.history){S.history=false;requestDraw();}return;}
 if(S.history)return;
 if(S.mode==='complete'&&e.key==='Enter'){S.page='roster';requestDraw();e.preventDefault();return;}
 if(S.mode==='choice'){const list=DATA.choices[S.node]||[];
  if(/^[1-4]$/.test(e.key)){pick(Number(e.key)-1);e.preventDefault();return;}
  if(e.key==='ArrowDown'){S.selectedOption=S.selectedOption<0?0:(S.selectedOption+1)%list.length;requestDraw();e.preventDefault();return;}
  if(e.key==='ArrowUp'){S.selectedOption=S.selectedOption<0?list.length-1:(S.selectedOption-1+list.length)%list.length;requestDraw();e.preventDefault();return;}
  if(e.key==='Enter'&&S.selectedOption>=0){pick(S.selectedOption);e.preventDefault();return;}
 }
 if(S.mode==='line'&&(e.key==='Enter'||e.key===' ')){step();e.preventDefault();}
});
