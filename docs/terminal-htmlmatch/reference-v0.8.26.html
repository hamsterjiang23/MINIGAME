function crtSettings(){

 {curve:.008,zoom:1.006,scan:.065,mask:.028,vignette:.11,blur:.055,glow:.025,grain:.0035};
}
function displayToSource(nx,ny){
 if(displayMode===0)return {x:nx,y:ny};
 const cfg=crtSettings(),qx=nx*2-1,qy=ny*2-1;
 const warp=cfg.zoom*(1+cfg.curve*(qx*qx+qy*qy));
 return {x:(qx*warp+1)*.5,y:(qy*warp+1)*.5};
}
let fallbackRaster=null,crtMap=null;
function paintFallback(){
 if(displayMode===0){ui.imageSmoothingEnabled=false;ui.clearRect(0,0,screen.width,screen.height);ui.drawImage(raw,0,0,screen.width,screen.height);return;}
 const dw=screen.width,dh=screen.height,cfg=crtSettings(),key=dw+'/'+dh+'/'+displayMode;
 if(!crtMap||crtMap.key!==key){
   // Geometry, scanlines, mask and static grain are cached; no idle animation loop.
   const indices=new Int32Array(dw*dh),gains=new Float32Array(dw*dh),channels=new Uint8Array(dw*dh);
   for(let yy=0;yy<dh;yy++)for(let xx=0;xx<dw;xx++){
     const i=yy*dw+xx,nx=(xx+.5)/dw,ny=(yy+.5)/dh;
     const qx=nx*2-1,qy=ny*2-1,warp=cfg.zoom*(1+cfg.curve*(qx*qx+qy*qy));
     const p={x:(qx*warp+1)*.5,y:(qy*warp+1)*.5};
     if(p.x<0||p.x>=1||p.y<0||p.y>=1){indices[i]=-1;continue;}
     indices[i]=(Math.min(H-1,Math.floor(p.y*H))*W+Math.min(W-1,Math.floor(p.x*W)))*4;
     const scan=1-cfg.scan*(.5-.5*Math.cos(p.y*H*Math.PI*2));
     const grain=((((xx*13+yy*7)%31)/30)-.5)*cfg.grain;
     gains[i]=scan*(1-cfg.vignette*Math.pow((qx*qx+qy*qy)*.5,1.25))*(1+grain);
     channels[i]=xx%3;
   }
   crtMap={key,indices,gains,channels};fallbackRaster=ui.createImageData(dw,dh);
 }
 const src=g.getImageData(0,0,W,H).data,dst=fallbackRaster.data;
 for(let i=0;i<crtMap.indices.length;i++){
   const si=crtMap.indices[i],di=i*4;dst[di+3]=255;
   if(si<0){dst[di]=7;dst[di+1]=5;dst[di+2]=2;continue;}
   const col=(si/4)%W,left=col>0?si-4:si,right=col<W-1?si+4:si;
   const up=si>=W*4?si-W*4:si,down=si<(H-1)*W*4?si+W*4:si;
   for(let c=0;c<3;c++){
     const base=src[si+c],near=(src[left+c]+src[right+c])*.5;
     const bright=Math.max(0,(src[left+c]+src[right+c]+src[up+c]+src[down+c])*.25-145)*cfg.glow;
     const mask=crtMap.channels[i]===0?1:1-cfg.mask;
     dst[di+c]=Math.min(255,((base*(1-cfg.blur)+near*cfg.blur+bright)*crtMap.gains[i]*mask));
   }
 }
 ui.putImageData(fallbackRaster,0,0);
}

 const budgetHeight=fullscreen?window.innerHeight:Math.max(80,window.innerHeight-$('bench').getBoundingClientRect().height);
 const padding=window.innerWidth<680?16:36;
 const availableWidth=Math.max(1,Math.min(zone.clientWidth,window.innerWidth)-padding),availableHeight=Math.max(1,budgetHeight-padding);
 const limit=zoom==='auto'?(fullscreen?2:1.25):Number(zoom);

 screen.style.width=Math.floor(W*scale)+'px';screen.style.height=Math.floor(H*scale)+'px';
 const dpr=Math.min(2,window.devicePixelRatio||1);

 const bh=displayMode===0?H:Math.max(H,Math.min(H*3,Math.round(Math.floor(H*scale)*dpr)));

function setPointer(e){

 const next=hit?.id??null;let selectionChanged=false;
 // Hover navigation updates the same durable selection used by keyboard input.
 // Leaving any hit region clears hover only; the last valid selection remains.
 if(POWER.phase==='running'&&next){
  const match=/^(roster|option|command)(\d+)$/.exec(next);
  if(match){
   const property=match[1]==='roster'?'rosterIndex':match[1]==='option'?'selectedOption':'selectedCommand';
   const index=Number(match[2]);
   if(S[property]!==index){S[property]=index;selectionChanged=true;}
  }

 screen.style.cursor=hit?'pointer':'default';
 if(next!==S.hover||selectionChanged){S.hover=next;requestDraw();}return hit;
}
