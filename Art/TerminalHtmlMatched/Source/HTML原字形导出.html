<!doctype html><meta charset="utf-8"><title>PMS · HTML 原字形导出</title>
<style>body{max-width:900px;margin:30px auto;padding:0 20px;background:#17130b;color:#eebd56;font:15px/1.7 sans-serif}textarea{width:100%;height:180px;background:#080603;color:#efb83f}button,select{margin:8px;padding:7px;background:#302510;color:#ffcf68;border:1px solid #a77d2d}canvas{max-width:100%;border:1px solid #674b19}</style>
<h1>HTML 原字形导出</h1><p>在装有宋体和 Lucida Console 的 Windows 电脑上使用。导出规则与 v0.8.12 的 text() 一致，保留五种文字配色各自的像素边缘。现有字形始终保留，可在下方补充新增文本或导入文本文件。</p>
<textarea id="extra" placeholder="粘贴新增对白或界面文字"></textarea><br><input id="files" type="file" multiple accept=".txt,.json,.cs,.yarn,.html"><label>图集尺寸 <select id="side"><option>2048</option><option>4096</option><option>8192</option></select></label><br>
<button id="build">生成图集</button><button id="png" disabled>下载 HTML_SimSun_Lucida.png</button><button id="json" disabled>下载 HTML_FontMetrics.json</button><p id="status">生成后将两个文件覆盖到 Assets/PMSAmberTerminal/Art/FontAtlas，保持原有 .meta 文件。</p><canvas id="atlas"></canvas>
<script>
const base=" !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ ¡¢£¤¥¦§¨©ª«¬­®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ–…↑↓−、。【】一七三上下不东个中为么也乱了些人什他令以们任会住作你例信候值做元入全共关再净出击分刚初别到前加动化区单原去及双反句可号后吗听启告员呢命和响哦哪嗯器回在场均坐处复天失好妈始字学孩它安完定审害察对小尚就屏工己已常幕并广应廊开归当录待很得态怎怕恨想慢成我或所扇手才打执抖择拿指按据接控措播收放效教敢数整新方施无日时明昨是显暂最有未本机束条来果查样核案档检次止正每比没治流测源滚灭点然熄状现珀班琥用界疗登白的监目直看真着知确示禁离移程站端笑第等答算系终经结统继绪续编缺置翻老能自至节藏行表西要见观览解认让记设诉试话说请谁谈象资走起跑跟跳蹲轮轻载过返还这进远适选通遍道那部都配释里重锁错键门闭阅阈隐面项预额首验，：；？",sizes=[10,11,12,13,14,18,19],colors=['#efb83f','#ffcf68','#a77d2d','#674b19','#170e02'];let metrics;
const $=id=>document.getElementById(id);
$('files').onchange=async e=>{for(const file of e.target.files)$('extra').value+='\n'+await file.text();};
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
$('build').onclick=()=>{try{
 if(!document.fonts.check("14px 'SimSun'")||!document.fonts.check("14px 'Lucida Console'"))throw Error('请先确认电脑已安装原 HTML 使用的宋体和 Lucida Console。');
 const chars=[...new Set([...base,...$('extra').value].filter(ch=>ch.charCodeAt(0)>=32))].sort((a,b)=>a.charCodeAt(0)-b.charCodeAt(0));
 const side=+$('side').value,c=$('atlas');c.width=c.height=side;const ag=c.getContext('2d');ag.imageSmoothingEnabled=false;
 const t=document.createElement('canvas');t.width=t.height=72;const g=t.getContext('2d');g.textBaseline='top';const glyphs=[];let x=1,y=1,rh=0;
 for(const color of colors)for(const size of sizes)for(const ch of chars){g.clearRect(0,0,72,72);const han=ch.charCodeAt(0)>255;g.font=han?`${size}px 'SimSun','Noto Serif CJK SC',serif`:`${size}px 'Lucida Console','Courier New',monospace`;g.fillStyle=color;g.fillText(ch,12,12);const d=g.getImageData(0,0,72,72).data;let minX=72,minY=72,maxX=-1,maxY=-1;
 for(let yy=0;yy<72;yy++)for(let xx=0;xx<72;xx++)if(d[(yy*72+xx)*4+3]){minX=Math.min(minX,xx);minY=Math.min(minY,yy);maxX=Math.max(maxX,xx);maxY=Math.max(maxY,yy);}
 const item={code:ch.charCodeAt(0),size,rgb:parseInt(color.slice(1),16),x:0,y:0,w:0,h:0,offsetX:0,offsetY:0,advance:han?size:Math.ceil(size*.6)};
 if(maxX>=0){const w=maxX-minX+1,h=maxY-minY+1;if(x+w+1>side){x=1;y+=rh+2;rh=0;}if(y+h+1>=side)throw Error('图集空间不足，请增大图集尺寸再生成。');ag.drawImage(t,minX,minY,w,h,x,y,w,h);Object.assign(item,{x,y,w,h,offsetX:minX-12,offsetY:minY-12});x+=w+2;rh=Math.max(rh,h);}glyphs.push(item);
 }
 metrics={reference:'HTML v0.8.12 Canvas font exporter; SimSun + Lucida Console; color-specific coverage',atlasWidth:side,atlasHeight:side,glyphs};$('png').disabled=$('json').disabled=false;$('status').textContent=`已生成 ${chars.length} 个字符、${glyphs.length} 个字号与颜色字形。下载两个文件并覆盖，保留 .meta。`;
}catch(e){$('status').textContent=e.message;}};
$('png').onclick=()=>{$('atlas').toBlob(blob=>download(blob,'HTML_SimSun_Lucida.png'),'image/png');};$('json').onclick=()=>download(new Blob([JSON.stringify(metrics)],{type:'application/json'}),'HTML_FontMetrics.json');
</script>
